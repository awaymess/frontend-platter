services:
  frontend-platter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://frontend-platter-api.nighttt.site/api
        NEXT_PUBLIC_SOCKET_URL: https://frontend-platter-api.nighttt.site
    container_name: frontend-platter
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.00
    env_file:
      - ../app.env
      - ../frontend.env
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.frontend-platter-app.rule=Host(`frontend-platter.nighttt.site`) || Host(`frontend-platter.localhost`)
      - traefik.http.services.frontend-platter-app.loadbalancer.server.port=3000

networks:
  proxy: { external: true }
